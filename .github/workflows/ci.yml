name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The same Prometheus image the monitoring profile runs, so the rule syntax and
      # the absence-rule tests are checked by the version that evaluates them.
      - name: Alert rules
        run: |
          docker run --rm -v "$PWD/monitoring:/m" -w /m --entrypoint promtool prom/prometheus:v3.13.3 check rules alert-rules.yml
          docker run --rm -v "$PWD/monitoring:/m" -w /m --entrypoint promtool prom/prometheus:v3.13.3 test rules alert-rules.test.yml

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test --no-build -c Release --project tests/Orders.UnitTests

      # Real SQL Server, RabbitMQ and Toxiproxy containers via Testcontainers.
      - name: Integration tests
        run: dotnet test --no-build -c Release --project tests/Saga.IntegrationTests

      # The real AppHost, the way `aspire run` starts it.
      - name: End-to-end smoke test
        run: dotnet test --no-build -c Release --project tests/Saga.E2E
